<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>GDI - FAQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        .main-background-color {
            background: #0093d2;
        }

        .logo-container {
            position: absolute;
            left: 20px;
        }

        .user_header {
            font-size: medium;
            text-align: center;
        }

        .margin {
            max-width: 90%;
            margin-left: 5%;
            margin-right: 5%;
        }

        .top_header {
            background: #0093d2;
            color: #fff;
            padding: 10px 0;

            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .paraline {
            background: #0093d2;
            color: #fff;
            font-weight: bold;
            padding: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .one-line-table {
            margin-left: 5%;
            margin-right: 5%;
            width: 90%;
        }

        .grid-container {
            display: grid;
            gap: 10px;
        }

        .link {
            color: #59cafa;
        }

        .h4-form {
            margin: 0;
        }

        .clickable {
            cursor: pointer;
        }

        .hidden-button {
            background: inherit;
            border: none;
            color: inherit;
            padding: 0;
            margin: 0;
            font: inherit;
            cursor: pointer;
            outline: inherit;
        }

        .maquette-paragraph {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .maquette-table {
            margin-top: 10px;
            margin-bottom: 50px;
        }

        .maquette-cell {
            width: 25%;
        }

        .maquette-cell-empty {
            width: 25%;
            background: #ef292986;
        }

        .maquette-cell-dead {
            width: 25%;
            background: #000000cb;
        }

        .modal-line {
            border-bottom: 1px solid #737373;
        }

        .maquette-icon {
            width: 4vw;
            min-width: 30px;
            height: 4vw;
            min-height: 30px;
            background: white;
        }
    </style>

</head>
<body> 
    <header>
        <div class="main-background-color" style="padding: 20px; text-align: center;">
            <div style="margin-bottom: 10px;">
                <img src="./img/logo.png" alt="Logo" class="logo" style="height: 75px; display: inline-block;">
            </div>
            <div>
                <p class="title" style="font-size:24px; color: #fff; margin: 0;"><b>Gestion du Département informatique</b></p>
            </div>
        </div>
    </header>

    <div class="w3-content w3-padding-64" style="max-width: 600px;">
        <div class="w3-card-4 w3-white w3-round">
            <div class="w3-container w3-padding-32" style="text-align: center;">
                <i class="fa fa-check-circle w3-text-green w3-jumbo"></i>
                <h3 class="w3-margin-bottom w3-margin-top"><b>Mot de passe changé</b></h3>

                <div class="w3-padding-16">
                    <p><strong>Votre mot de passe a bien été mis à jour.</strong></p>
                    <p>Si vous n'êtes pas à l'origine de cette modification, veuillez contacter immédiatement l'administrateur du système.</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="w3-container w3-padding-16 w3-text-white main-background-color w3-xlarge" style="text-align: center;">
        <div align="center">
            <a href="https://github.com/JrCanDev/GDI" target="_blank"><i class="fab fa-github w3-hover-opacity" aria-hidden="true"></i></a>
            <p class="w3-medium">Powered by <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a></p>
            <p class="w3-medium">Hébergé par <a href="https://github.com/JrCanDev" target="_blank">JrCanDev</a></p>
        </div>
    </footer>
</body>
</html>
