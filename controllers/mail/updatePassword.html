<!--
    Cette page est envoyée par mail.
    Contraintes : pas de JavaScript, pas de CSS externe (w3.css, Bootstrap…),
    pas de <link>, les styles doivent être inline ou dans un <style> dans le <head>.

    
    Pour les images : 
    L'image est attachée au mail en tant que pièce jointe inline
    et référencée par un identifiant unique (CID).
    Elle s'affiche même sans connexion et n'est pas bloquée.

    Dans le HTML :
        <img src="cid:logo" alt="Logo">

       Côté PHP :
           $mail->addEmbeddedImage('/chemin/vers/logo.png', 'logo');
                                                             ^^^^^ doit correspondre au cid 
-->
